<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brayden TV</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tv-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
        }

        .tv-header {
            display: flex;
            align-items: center;
            gap: 20px;
            letter-spacing: 0.15em;
            font-size: 0.85em;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ff2200;
            text-shadow: 0 0 8px #ff2200;
            font-size: 0.9em;
            letter-spacing: 0.2em;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff2200;
            border-radius: 50%;
            box-shadow: 0 0 6px #ff2200;
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.1; }
        }

        .channel-id {
            color: #00ff41;
            text-shadow: 0 0 6px #00ff41;
        }

        .tv-screen {
            position: relative;
            width: 100%;
            max-width: 860px;
            border: 2px solid #00ff41;
            box-shadow: 0 0 20px #00ff41, 0 0 60px rgba(0, 255, 65, 0.2);
        }

        .tv-screen video {
            display: block;
            width: 100%;
            height: auto;
        }

        /* CRT screen flicker on top of the video */
        .tv-screen::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.08) 2px,
                rgba(0, 0, 0, 0.08) 4px
            );
            pointer-events: none;
        }

        .click-audio {
            font-size: 0.85em;
            letter-spacing: 0.15em;
            cursor: pointer;
            color: #ffe600;
            text-shadow: 0 0 6px #ffe600, 0 0 12px #cc9900;
        }

        .click-audio:hover {
            color: #ffffff;
        }

        .tv-footer-info {
            font-size: 0.72em;
            color: #005a17;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <nav class="breadcrumb">
        <a href="index.html">Home</a> &rsaquo; Brayden TV
    </nav>

    <h1>Brayden TV</h1>

    <div class="tv-container">
        <div class="tv-header">
            <span class="channel-id">CH. 1</span>
            <span class="live-badge">
                <span class="live-dot"></span> LIVE
            </span>
        </div>

        <div class="tv-screen">
            <video id="tv-video" muted loop playsinline crossorigin="anonymous">
                <source src="https://ia601306.us.archive.org/31/items/harry-potter-and-the-sorcerers-stone-vhs/harry%20potter%20and%20the%20sorcerer%27s%20stone%20%28VHS%29.mp4" type="video/mp4">
            </video>
        </div>

        <p class="click-audio" id="audio-hint" onclick="toggleAudio()">[ Click for Audio ]</p>
        <p class="tv-footer-info">[ TUNING IN PROGRESS — STREAM ALREADY IN PROGRESS ]</p>
    </div>

    <footer>
        <p>Visit my Ole Pal Jake's Site.</p>
        <a href="https://jakewel.ch"><img src="Assets/Images/88x31.gif" alt="jakewel.ch"></a>
    </footer>

    <script>
        const video = document.getElementById('tv-video');

        video.addEventListener('loadedmetadata', () => {
            video.currentTime = Math.random() * video.duration;
            video.play();
        });

        function toggleAudio() {
            video.muted = !video.muted;
            document.getElementById('audio-hint').textContent = video.muted
                ? '[ Click for Audio ]'
                : '[ Click to Mute ]';
        }
    </script>
</body>
</html>
