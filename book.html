<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zine — braydenrichards.com</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .book-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-top: 20px;
        }

        #loading {
            padding: 60px 0;
            letter-spacing: 0.15em;
            text-shadow: 0 0 8px #00ff41;
            animation: flicker 2s infinite;
        }

        #book-container {
            display: none;
        }

        #book .page {
            background: #0f0f0f;
            overflow: hidden;
        }

        #book .page canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls {
            display: none;
            align-items: center;
            gap: 24px;
        }

        .btn {
            background: transparent;
            border: 1px solid #00ff41;
            color: #00ff41;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-size: 0.85em;
            padding: 8px 22px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            transition: background 0.15s, color 0.15s;
        }

        .btn:hover:not(:disabled) {
            background: #00ff41;
            color: #0a0a00;
        }

        .btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        #page-counter {
            font-size: 0.8em;
            letter-spacing: 0.12em;
            min-width: 120px;
            text-align: center;
            text-shadow: 0 0 6px #00ff41;
        }

        .hint {
            font-size: 0.72em;
            color: #005a17;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <nav class="breadcrumb">
        <a href="index.html">Home</a> &rsaquo; Zine
        <a href="tv.html">Brayden TV</a>
    </nav>

    <h1>Zine</h1>

    <div class="book-wrapper">
        <div id="loading">[ INITIALIZING... ]</div>

        <div id="book-container">
            <div id="book"></div>
        </div>

        <div class="controls" id="controls">
            <button class="btn" id="btn-prev">&lt; PREV</button>
            <span id="page-counter">PAGE 1 / ?</span>
            <button class="btn" id="btn-next">NEXT &gt;</button>
        </div>

        <p class="hint">[ CLICK PAGES OR USE BUTTONS TO TURN ]</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>
    <script>
        const PDF_URL = 'Assets/indb/Zine.pdf';
        const RENDER_SCALE = 2;

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        async function init() {
            const loadingEl   = document.getElementById('loading');
            const containerEl = document.getElementById('book-container');
            const controlsEl  = document.getElementById('controls');
            const bookEl      = document.getElementById('book');
            const counter     = document.getElementById('page-counter');
            const btnPrev     = document.getElementById('btn-prev');
            const btnNext     = document.getElementById('btn-next');

            try {
                loadingEl.textContent = '[ LOADING PDF... ]';
                const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
                const numPages = pdf.numPages;

                const firstPage = await pdf.getPage(1);
                const firstVP   = firstPage.getViewport({ scale: RENDER_SCALE });
                const aspect    = firstVP.height / firstVP.width;

                const portrait  = window.innerWidth < 700;
                const maxPageW  = portrait
                    ? Math.min(Math.floor(window.innerWidth * 0.92), firstVP.width)
                    : Math.min(Math.floor(window.innerWidth * 0.44), firstVP.width);
                const displayW  = maxPageW;
                const displayH  = Math.min(
                    Math.floor(displayW * aspect),
                    Math.floor(window.innerHeight * 0.82)
                );

                for (let i = 1; i <= numPages; i++) {
                    loadingEl.textContent = `[ RENDERING PAGE ${i} / ${numPages}... ]`;

                    const page = await pdf.getPage(i);
                    const vp   = page.getViewport({ scale: RENDER_SCALE });

                    const canvas  = document.createElement('canvas');
                    canvas.width  = Math.floor(vp.width);
                    canvas.height = Math.floor(vp.height);

                    await page.render({
                        canvasContext: canvas.getContext('2d'),
                        viewport: vp,
                    }).promise;

                    const div = document.createElement('div');
                    div.className = 'page';
                    div.appendChild(canvas);
                    bookEl.appendChild(div);
                }

                loadingEl.style.display   = 'none';
                containerEl.style.display = 'block';
                controlsEl.style.display  = 'flex';

                const pageFlip = new St.PageFlip(bookEl, {
                    width:               displayW,
                    height:              displayH,
                    size:                'fixed',
                    drawShadow:          true,
                    flippingTime:        550,
                    usePortrait:         portrait,
                    startPage:           0,
                    showCover:           true,
                    mobileScrollSupport: false,
                    swipeDistance:       30,
                    maxShadowOpacity:    0.4,
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                function updateUI() {
                    const idx = pageFlip.getCurrentPageIndex();
                    counter.textContent = `PAGE ${idx + 1} / ${numPages}`;
                    btnPrev.disabled = idx === 0;
                    btnNext.disabled = idx >= numPages - 1;
                }

                pageFlip.on('flip', updateUI);
                updateUI();

                btnPrev.addEventListener('click', () => pageFlip.flipPrev());
                btnNext.addEventListener('click', () => pageFlip.flipNext());

            } catch (err) {
                loadingEl.textContent = `[ ERROR: ${err.message} ]`;
                console.error(err);
            }
        }

        init();
    </script>
<footer>
    <p>Visit my Ole Pal Jake's Site.</p>
    <a href="https://jakewel.ch"><img src="Assets/Images/88x31.gif" alt="jakewel.ch"></a>
</footer>
</body>
</html>
