<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zine — braydenrichards.com</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .book-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-top: 20px;
        }

        #loading {
            padding: 60px 0;
            letter-spacing: 0.15em;
            text-shadow: 0 0 8px #00ff41;
            animation: flicker 2s infinite;
        }

        #book-container {
            display: none;
        }

        #book .page {
            background: #0f0f0f;
            overflow: hidden;
        }

        #book .page canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls {
            display: none;
            align-items: center;
            gap: 24px;
        }

        .btn {
            background: transparent;
            border: 1px solid #00ff41;
            color: #00ff41;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-size: 0.85em;
            padding: 8px 22px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            transition: background 0.15s, color 0.15s;
        }

        .btn:hover:not(:disabled) {
            background: #00ff41;
            color: #0a0a00;
        }

        .btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        #page-counter {
            font-size: 0.8em;
            letter-spacing: 0.12em;
            min-width: 120px;
            text-align: center;
            text-shadow: 0 0 6px #00ff41;
        }

        .hint {
            font-size: 0.72em;
            color: #005a17;
            letter-spacing: 0.08em;
        }

        .edition-selector {
            display: flex;
            gap: 0;
        }

        .edition-btn {
            background: transparent;
            border: 1px solid #00ff41;
            color: #005a17;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-size: 0.82em;
            padding: 8px 24px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.15s;
        }

        .edition-btn + .edition-btn { border-left: none; }

        .edition-btn.active {
            background: rgba(0, 255, 65, 0.1);
            color: #00ff41;
            text-shadow: 0 0 6px #00ff41;
            box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.12);
        }

        .edition-btn:hover:not(.active) {
            color: #00ff41;
        }

        #cover-preview {
            position: fixed;
            display: none;
            z-index: 50;
            background: #0a0a00;
            border: 1px solid #00ff41;
            box-shadow: 0 0 16px #00ff41, 0 0 40px rgba(0,255,65,0.15);
            padding: 6px 6px 4px;
            pointer-events: none;
        }

        #cover-preview canvas {
            display: block;
            width: 150px;
            height: auto;
        }

        #cover-preview-label {
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-size: 0.62em;
            letter-spacing: 0.18em;
            color: #00ff41;
            text-shadow: 0 0 6px #00ff41;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <nav class="breadcrumb">
        <a href="index.html">Home</a> &rsaquo; Zine
        <a href="tv.html">Brayden TV</a>
    </nav>

    <h1>Zine</h1>

    <div class="book-wrapper">
        <div class="edition-selector">
            <button class="edition-btn active" onclick="selectEdition(this, 'Assets/indb/Zine.pdf')">Edition 1</button>
            <button class="edition-btn" onclick="selectEdition(this, 'Assets/indb/July Zine.pdf')">Edition 2</button>
        </div>

        <div id="loading">[ INITIALIZING... ]</div>

        <div id="book-container">
            <div id="book"></div>
        </div>

        <div class="controls" id="controls">
            <button class="btn" id="btn-prev">&lt; PREV</button>
            <span id="page-counter">PAGE 1 / ?</span>
            <button class="btn" id="btn-next">NEXT &gt;</button>
        </div>

        <p class="hint">[ CLICK PAGES OR USE BUTTONS TO TURN ]</p>
    </div>

    <div id="cover-preview">
        <canvas id="cover-preview-canvas"></canvas>
        <div id="cover-preview-label"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>
    <script>
        const RENDER_SCALE = 2;

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let currentPageFlip = null;

        function selectEdition(btn, url) {
            document.querySelectorAll('.edition-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Reset UI for reload
            const bookEl      = document.getElementById('book');
            const containerEl = document.getElementById('book-container');
            const controlsEl  = document.getElementById('controls');
            const loadingEl   = document.getElementById('loading');

            if (currentPageFlip) {
                currentPageFlip.destroy();
                currentPageFlip = null;
            }
            // destroy() removes the #book element from the DOM, so recreate it
            containerEl.innerHTML = '<div id="book"></div>';
            containerEl.style.display = 'none';
            controlsEl.style.display  = 'none';
            loadingEl.style.display   = 'block';
            loadingEl.textContent     = '[ INITIALIZING... ]';

            init(url);
        }

        async function init(PDF_URL = 'Assets/indb/Zine.pdf') {
            const loadingEl   = document.getElementById('loading');
            const containerEl = document.getElementById('book-container');
            const controlsEl  = document.getElementById('controls');
            const bookEl      = document.getElementById('book');
            const counter     = document.getElementById('page-counter');
            const btnPrev     = document.getElementById('btn-prev');
            const btnNext     = document.getElementById('btn-next');

            try {
                loadingEl.textContent = '[ LOADING PDF... ]';
                const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
                const numPages = pdf.numPages;

                const firstPage = await pdf.getPage(1);
                const firstVP   = firstPage.getViewport({ scale: RENDER_SCALE });
                const aspect    = firstVP.height / firstVP.width;

                const portrait  = window.innerWidth < 700;
                const maxPageW  = portrait
                    ? Math.min(Math.floor(window.innerWidth * 0.92), firstVP.width)
                    : Math.min(Math.floor(window.innerWidth * 0.44), firstVP.width);
                const displayW  = maxPageW;
                const displayH  = Math.min(
                    Math.floor(displayW * aspect),
                    Math.floor(window.innerHeight * 0.82)
                );

                for (let i = 1; i <= numPages; i++) {
                    loadingEl.textContent = `[ RENDERING PAGE ${i} / ${numPages}... ]`;

                    const page = await pdf.getPage(i);
                    const vp   = page.getViewport({ scale: RENDER_SCALE });

                    const canvas  = document.createElement('canvas');
                    canvas.width  = Math.floor(vp.width);
                    canvas.height = Math.floor(vp.height);

                    await page.render({
                        canvasContext: canvas.getContext('2d'),
                        viewport: vp,
                    }).promise;

                    const div = document.createElement('div');
                    div.className = 'page';
                    div.appendChild(canvas);
                    bookEl.appendChild(div);
                }

                loadingEl.style.display   = 'none';
                containerEl.style.display = 'block';
                controlsEl.style.display  = 'flex';

                currentPageFlip = new St.PageFlip(bookEl, {
                    width:               displayW,
                    height:              displayH,
                    size:                'fixed',
                    drawShadow:          true,
                    flippingTime:        550,
                    usePortrait:         portrait,
                    startPage:           0,
                    showCover:           true,
                    mobileScrollSupport: false,
                    swipeDistance:       30,
                    maxShadowOpacity:    0.4,
                });

                currentPageFlip.loadFromHTML(document.querySelectorAll('.page'));

                function updateUI() {
                    const idx = currentPageFlip.getCurrentPageIndex();
                    counter.textContent = `PAGE ${idx + 1} / ${numPages}`;
                    btnPrev.disabled = idx === 0;
                    btnNext.disabled = idx >= numPages - 1;
                }

                currentPageFlip.on('flip', updateUI);
                updateUI();

                btnPrev.onclick = () => currentPageFlip.flipPrev();
                btnNext.onclick = () => currentPageFlip.flipNext();

            } catch (err) {
                loadingEl.textContent = `[ ERROR: ${err.message} ]`;
                console.error(err);
            }
        }

        init();

        // ── Edition cover previews ──
        const EDITIONS = [
            { url: 'Assets/indb/Zine.pdf',      label: 'EDITION 1' },
            { url: 'Assets/indb/July Zine.pdf',  label: 'EDITION 2' },
        ];
        const coverCache = {};

        async function renderCover(url) {
            if (coverCache[url]) return coverCache[url];
            const pdf    = await pdfjsLib.getDocument(url).promise;
            const page   = await pdf.getPage(1);
            const vp     = page.getViewport({ scale: 0.6 });
            const canvas = document.createElement('canvas');
            canvas.width  = Math.floor(vp.width);
            canvas.height = Math.floor(vp.height);
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
            coverCache[url] = canvas;
            return canvas;
        }

        const preview      = document.getElementById('cover-preview');
        const previewCanvas = document.getElementById('cover-preview-canvas');
        const previewLabel = document.getElementById('cover-preview-label');

        document.querySelectorAll('.edition-btn').forEach((btn, i) => {
            const edition = EDITIONS[i];

            btn.addEventListener('mouseenter', async () => {
                try {
                    const src = await renderCover(edition.url);
                    // Copy rendered canvas into the preview canvas
                    previewCanvas.width  = src.width;
                    previewCanvas.height = src.height;
                    previewCanvas.getContext('2d').drawImage(src, 0, 0);
                    previewLabel.textContent = edition.label;

                    preview.style.display = 'block';
                    const rect = btn.getBoundingClientRect();
                    const pw   = preview.offsetWidth;
                    const ph   = preview.offsetHeight;
                    let left   = rect.left + rect.width / 2 - pw / 2;
                    let top    = rect.top - ph - 12;
                    left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
                    if (top < 8) top = rect.bottom + 12;
                    preview.style.left = left + 'px';
                    preview.style.top  = top  + 'px';
                } catch (e) { /* cover unavailable */ }
            });

            btn.addEventListener('mouseleave', () => {
                preview.style.display = 'none';
            });
        });

        // Pre-warm the cache after the main book has had a moment to render
        setTimeout(() => EDITIONS.forEach(e => renderCover(e.url).catch(() => {})), 1500);
    </script>
<footer>
    <p>Visit my Ole Pal Jake's Site.</p>
    <a href="https://jakewel.ch"><img src="Assets/Images/88x31.gif" alt="jakewel.ch"></a>
</footer>
</body>
</html>
